[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itasca-mcp-bridge"
dynamic = ["version"]
description = "WebSocket bridge for ITASCA codes (PFC, FLAC3D, ...) - runs inside the product GUI to enable remote simulation control"
requires-python = ">=3.6"
license = { text = "MIT" }
authors = [{ name= "Yusong Han", email = "yusong.han.652@gmail.com" }, { name = "Nagisa Toyoura", email = "nagisa.toyoura@gmail.com" }]
keywords = ["itasca", "itasca-software", "pfc", "flac", "flac3d", "3dec", "mcp", "simulation", "websocket", "bridge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "websockets==9.1; python_version < '3.10'",
    "websockets==16.0; python_version >= '3.10'",
]
readme = "README.md"

[project.scripts]
itasca-mcp-bridge = "itasca_mcp_bridge.__main__:main"

[tool.hatch.version]
path = "src/itasca_mcp_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/itasca_mcp_bridge"]
